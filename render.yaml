services:
  - type: web
    name: resume-radar-api
    runtime: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: ALLOWED_ORIGIN
        sync: false
      - key: RATE_LIMIT_MAX
        value: "8"
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: "60"
